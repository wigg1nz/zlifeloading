<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Z-Life</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    background: #000;
  }
</style>
</head>
<body>
<video id="bg" autoplay loop playsinline preload="auto">
  <source src="intro.webm" type="video/webm">
</video>

<script>
  var video = document.getElementById("bg");
  video.volume = 0.5;

  // Try to play with sound; if the browser refuses, play muted instead.
  function start() {
    var p = video.play();
    if (p && p.catch) {
      p.catch(function () {
        video.muted = true;
        video.play();
      });
    }
  }
  start();

  // Garry's Mod calls this when the page loads. "volume" is the player's
  // own loading-screen volume setting (0 to 1), so we respect it.
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    if (typeof volume === "number" && !isNaN(volume)) {
      video.volume = Math.max(0, Math.min(1, volume));
    }
  }
</script>
</body>
</html>
